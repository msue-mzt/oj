<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231e88e5%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-size=%2213%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22monospace%22 font-weight=%22bold%22%3E%26lt;/%26gt;%3C/text%3E%3C/svg%3E">

<body>

<header class="oj-nav">
  <div class="oj-nav-inner">
    <a href="#/" class="oj-brand">
      <span class="oj-logo">&lt;/&gt;</span>
      <span class="oj-brand-text">Online<b>Judge</b></span>
    </a>

    <button class="oj-burger" id="ojBurger" aria-label="Цэс" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <nav class="oj-menu" id="ojMenu">
      <a href="#/" data-route="home">Нүүр хуудас</a>
      <a href="#/problems" data-route="problems">Бодлогууд</a>
      <a href="#/contests" data-route="contests">Тэмцээн</a>
      <a href="#/courses" data-route="courses">Хичээлийн материал</a>
      <a href="#/rating" data-route="rating">Рейтинг</a>
      <a href="#/posts" data-route="posts">Нийтлэл</a>
    </nav>

    <div class="oj-right">
      <a href="#/rating" class="solved" title="Бодсон бодлого"><span id="solvedCount">0</span>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.5 2.5 5-5.5"/></svg></a>

<main id="app" class="oj-main"><p class="muted">Ачаалж байна…</p></main>

<footer class="foot oj-foot">Мэдээлэл зүйн бодлого шалгах систем 1.0.1 · МУБИС</footer>

<script>
(function () {
  var menu = document.getElementById('ojMenu');
  var burger = document.getElementById('ojBurger');
  burger.addEventListener('click', function () {
    var open = menu.classList.toggle('open');
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  window.addEventListener('hashchange', function () { menu.classList.remove('open'); });
})();
</script>
</body>
